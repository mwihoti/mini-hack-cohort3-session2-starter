name: Welcome Bot

on:
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Comment welcome message
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for the PR! A few reminders before review:\n\n" +
                "- Post this PR link in Discord `#submissions` before Sunday midnight EAT\n" +
                "- Screenshot your working test + this PR, post both on X tagging @code_mwangi and @AvaxAfrica, and hold onto that link for the quest page\n" +
                "- Double check `.env` is not committed\n" +
                "- Make sure the submission checklist above is filled in\n\n" +
                "Someone from the Team1 Kenya team will review within 48 hours."
            })
